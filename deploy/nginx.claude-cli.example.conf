# Open Design — nginx Reverse Proxy Beispiel
#
# Setup-Annahmen:
#   - Open Design Container laeuft auf 127.0.0.1:7456 (siehe .env.claude-cli)
#   - Domain z.B. design.example.com, Let's Encrypt via certbot
#   - HTTP-Basic-Auth schuetzt /api und UI gegen unauthentifizierten Zugriff
#     (der Daemon selbst hat KEINE Auth)
#
# Vorbereitung auf dem Server:
#   sudo apt install nginx apache2-utils certbot python3-certbot-nginx
#   sudo htpasswd -c /etc/nginx/.od-htpasswd <username>
#   sudo cp nginx.claude-cli.example.conf /etc/nginx/sites-available/open-design
#   sudo ln -s /etc/nginx/sites-available/open-design /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d design.example.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream open_design_claude {
    server 127.0.0.1:7456;
    keepalive 16;
}

# HTTP -> HTTPS Redirect (certbot legt das normalerweise selbst an).
server {
    listen 80;
    listen [::]:80;
    server_name design.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name design.example.com;

    # certbot ergaenzt diese Zeilen automatisch:
    # ssl_certificate     /etc/letsencrypt/live/design.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/design.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Upload-Limit fuer Imports (Claude-Design ZIP, Asset-Uploads etc.).
    client_max_body_size 200m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS nur wenn du sicher bist nie wieder auf HTTP zurueck zu wollen:
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Basic Auth global. Wenn du das UI fuer Embeds/Iframes oeffentlich
    # zugaenglich brauchst, Auth stattdessen pro location-Block setzen.
    auth_basic           "Open Design";
    auth_basic_user_file /etc/nginx/.od-htpasswd;

    # SSE braucht laenger lebende Verbindungen + Buffer off
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Healthcheck darf unauthentifiziert sein (fuer Monitoring/UptimeRobot etc.)
    location = /api/health {
        auth_basic off;
        proxy_pass http://open_design_claude;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://open_design_claude;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ─── Alternative: Caddy ───────────────────────────────────────────────────────
#
# Wenn du Caddy statt nginx nutzt (SSL automatisch), Caddyfile wie folgt:
#
#   design.example.com {
#       encode gzip
#       basicauth /* {
#           # erzeugen mit: caddy hash-password
#           admin $2a$14$hashedpasswordhere
#       }
#       reverse_proxy 127.0.0.1:7456 {
#           flush_interval -1   # SSE: kein Buffering
#       }
#   }
