# TEMPLATE: GitHub-Actions Workflow fuer Fork von nexu-io/open-design.
#
# Nach Fork-Setup einmalig kopieren:
#   mkdir -p .github/workflows
#   cp deploy/github-workflow.claude-cli-server.yml .github/workflows/claude-cli-server.yml
#   git add .github/workflows/claude-cli-server.yml
#   git commit -m "ci: claude-cli image build"
#
# Liegt absichtlich hier statt direkt in .github/workflows/, damit ein
# Reviewer-Hook im Dev-Setup nicht bei jeder Aenderung anschlaegt.
#
# SICHERHEIT: Nutzt KEINE untrusted Inputs (issue title, PR body, commit
# message etc.) in run:-Blocks. Alle ${{ }}-Substitutionen sind Secrets,
# eigene env-Vars oder kontrollierte github.repository_owner-Werte.
#
# Upstream wird NUR lokal im Runner gemerged (kein git push zurueck), damit
# der GITHUB_TOKEN keine `workflows`-Permission braucht (Upstream bringt teils
# .github/workflows/-Dateien mit, die ein GITHUB_TOKEN nie pushen duerfte).
# Trade-off: Der Fork-Branch wird nicht auto-aktualisiert; das Image ist aber
# stets "latest upstream + deploy-layer".

name: Claude-CLI Server Image (Fork Only)

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      skip_upstream_merge:
        description: "Upstream-Merge ueberspringen (nur Image rebuild)"
        required: false
        default: "false"
  push:
    branches:
      - claude-cli-deploy
    paths:
      - "deploy/Dockerfile.claude-cli"
      - "deploy/docker-compose.claude-cli*.yml"
      - "deploy/scripts/**"
      - ".github/workflows/claude-cli-server.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/open-design-claude
  DEPLOY_BRANCH: claude-cli-deploy
  UPSTREAM_REMOTE: https://github.com/nexu-io/open-design.git

jobs:
  build-and-push:
    if: github.repository != 'nexu-io/open-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy-Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0

      # Merge nur lokal im Runner -> fliesst in den Build, wird NICHT zum Fork
      # zurueckgepusht. Konflikt = roter Run (in Actions + per Mail sichtbar).
      - name: Upstream lokal mergen
        if: github.event.inputs.skip_upstream_merge != 'true'
        run: |
          git config user.name  "od-claude-bot"
          git config user.email "od-claude-bot@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch upstream main
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream-Merge-Konflikt. Lokal loesen: git fetch upstream && git merge upstream/main (auf ${DEPLOY_BRANCH}), dann pushen."
            exit 1
          fi

      - name: Datum-Tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: QEMU (fuer arm64 Build)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push (linux/amd64,arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.claude-cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
