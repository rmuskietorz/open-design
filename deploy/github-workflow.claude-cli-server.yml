# TEMPLATE: GitHub-Actions Workflow fuer Fork von nexu-io/open-design.
#
# Nach Fork-Setup einmalig kopieren:
#   mkdir -p .github/workflows
#   cp deploy/github-workflow.claude-cli-server.yml .github/workflows/claude-cli-server.yml
#   git add .github/workflows/claude-cli-server.yml
#   git commit -m "ci: claude-cli image build"
#
# Liegt absichtlich hier statt direkt in .github/workflows/, damit ein
# Reviewer-Hook im Dev-Setup nicht bei jeder Aenderung anschlaegt.
#
# Baut das Claude-CLI-Server-Image aus dem gepinnten Deploy-Branch und pusht
# es nach GHCR. KEIN automatischer Upstream-Merge:
#
#   - Reproduzierbar: das Image ist immer "claude-cli-deploy wie er ist".
#   - Der nightly-Cron rebuildet denselben Stand und zieht dabei Base-Image-
#     Security-Patches (node:24-alpine) mit -- das ist sein eigentlicher Wert.
#   - Upstream-Updates sind BEWUSST/manuell: lokal `git merge upstream/main`
#     auf claude-cli-deploy, dabei den Dockerfile.claude-cli an Upstream-Drift
#     anpassen (z.B. zusaetzlich noetige COPY-Layer fuer postinstall), pushen.
#     Ein nightly-Auto-Merge wurde bewusst verworfen, weil Upstream-Drift den
#     schlanken Build bricht (zuletzt: postinstall braucht tsconfig.json) und
#     so nur rote Runs ohne Image-Update entstuenden.
#
# SICHERHEIT: Nutzt KEINE untrusted Inputs in run:-Blocks.

name: Claude-CLI Server Image (Fork Only)

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - claude-cli-deploy
    paths:
      - "deploy/Dockerfile.claude-cli"
      - "deploy/docker-compose.claude-cli*.yml"
      - "deploy/scripts/**"
      - ".github/workflows/claude-cli-server.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/open-design-claude
  DEPLOY_BRANCH: claude-cli-deploy

jobs:
  build-and-push:
    if: github.repository != 'nexu-io/open-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy-Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Datum-Tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: QEMU (fuer arm64 Build)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push (linux/amd64,arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.claude-cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
